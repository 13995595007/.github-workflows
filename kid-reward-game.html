<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星星冒险队：好习惯闯关游戏</title>
  <style>
    :root {
      --bg1: #8ec5ff;
      --bg2: #ffe78f;
      --panel: #ffffff;
      --text: #1f2937;
      --good: #16a34a;
      --bad: #dc2626;
      --primary: #2563eb;
      --line: #dbeafe;
      --shadow: 0 12px 30px rgba(37, 99, 235, 0.18);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, #b9e4ff 0%, #98d0ff 40%, #ffe793 100%);
      min-height: 100vh;
      padding: 14px;
    }

    .game {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 3px solid #fff;
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .header {
      background: linear-gradient(130deg, #2563eb, #22c55e);
      color: #fff;
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .header::after {
      content: "✨⭐✨⭐✨";
      position: absolute;
      right: 16px;
      top: 14px;
      font-size: 1.2rem;
      opacity: .8;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes twinkle { from { transform: scale(1); } to { transform: scale(1.15); } }

    .header h1 { margin: 0 0 4px; font-size: 1.7rem; }
    .header p { margin: 0; opacity: .95; }

    .body, .side { padding: 14px; }

    .hero {
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      background: linear-gradient(120deg, #eef7ff, #fff5cc);
      border: 2px dashed #93c5fd;
      border-radius: 14px;
      padding: 8px;
    }

    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 2.1rem;
      background: #fff;
      border: 3px solid #bfdbfe;
      animation: bob 1.6s ease-in-out infinite;
    }

    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

    .level-wrap { margin-top: 6px; }
    .level-bar {
      width: 100%;
      height: 12px;
      background: #dbeafe;
      border-radius: 999px;
      overflow: hidden;
    }

    .level-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      transition: width .3s;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .stat {
      background: #f8fafc;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      text-align: center;
      padding: 8px;
    }

    .stat strong { display: block; margin-top: 4px; font-size: 1.2rem; }

    .scenario {
      border: 2px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 12px;
      line-height: 1.65;
      min-height: 130px;
      margin-bottom: 10px;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .14s, filter .14s;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.03); }
    .good-btn { background: #dcfce7; color: #166534; }
    .bad-btn { background: #fee2e2; color: #991b1b; }
    .next-btn { background: #dbeafe; color: #1e3a8a; }
    .hint-btn { background: #fef3c7; color: #92400e; }
    .reset-btn { background: #e5e7eb; color: #111827; }

    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .difficulty { margin-left: auto; font-size: .9rem; }

    .mission-map {
      margin-top: 10px;
      padding: 10px;
      border: 2px dashed #fcd34d;
      border-radius: 12px;
      background: #fffbeb;
      font-size: .92rem;
    }

    .planet {
      display: inline-block;
      margin-right: 6px;
      opacity: .35;
      transform: scale(1);
      transition: .2s;
    }
    .planet.on { opacity: 1; transform: scale(1.1); }

    .chest {
      border: 2px solid #fde68a;
      background: #fffbeb;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
      line-height: 1.6;
    }

    .badge-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: .82rem;
    }
    .badge.on { background: #dcfce7; border-color: #86efac; color: #166534; }

    .log {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 320px;
      overflow: auto;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
    }

    .log li { padding: 8px; border-bottom: 1px solid #f1f5f9; font-size: .9rem; }
    .good { color: var(--good); font-weight: 700; }
    .bad { color: var(--bad); font-weight: 700; }

    .fx {
      position: fixed;
      top: 16px;
      right: 16px;
      background: #fff;
      border: 2px solid #bfdbfe;
      border-radius: 12px;
      padding: 8px 12px;
      box-shadow: var(--shadow);
      font-weight: 700;
      opacity: 0;
      transform: translateY(-10px);
      transition: .3s;
      pointer-events: none;
      z-index: 10;
    }

    .fx.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 960px) {
      .game { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
      .answers { grid-template-columns: 1fr; }
      .difficulty { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="fx" id="fxToast">+3 星星能量！</div>
  <main class="game">
    <section class="card">
      <header class="header">
        <h1>🚀 星星冒险队</h1>
        <p>选择好习惯，收集星星能量，和小勇士一起闯关！</p>
      </header>

      <div class="body">
        <div class="hero">
          <div class="avatar" id="avatar">🧒</div>
          <div>
            <div><strong id="rank">见习小队员</strong></div>
            <div style="font-size:.92rem;color:#64748b;">等级进度：<span id="levelText">0 / 30</span></div>
            <div class="level-wrap"><div class="level-bar"><div class="level-fill" id="levelFill"></div></div></div>
          </div>
        </div>

        <div class="stats">
          <div class="stat">🎯 积分<strong id="score">0</strong></div>
          <div class="stat">⭐ 星星<strong id="stars">0</strong></div>
          <div class="stat">🔥 连胜<strong id="streak">0</strong></div>
          <div class="stat">😊 心情<strong id="mood">平静</strong></div>
        </div>

        <article class="scenario" id="scenario"></article>

        <div class="answers">
          <button class="good-btn" id="goodBtn">好习惯出击 ✅</button>
          <button class="bad-btn" id="badBtn">坏习惯陷阱 ❌</button>
        </div>

        <div class="controls">
          <button class="next-btn" id="nextBtn">下一关 ➡️</button>
          <button class="hint-btn" id="hintBtn">求助提示 💡</button>
          <button class="reset-btn" id="resetBtn">重新冒险 🔄</button>

          <label class="difficulty">难度
            <select id="difficultySel">
              <option value="easy">简单（±2）</option>
              <option value="normal" selected>普通（+3/-2）</option>
              <option value="hard">挑战（+4/-3）</option>
            </select>
          </label>
        </div>

        <div class="mission-map">
          地图进度：
          <span id="planet1" class="planet">🪐</span>
          <span id="planet2" class="planet">🌎</span>
          <span id="planet3" class="planet">🌕</span>
          <span id="planet4" class="planet">🌟</span>
          <span id="planet5" class="planet">🏆</span>
        </div>
      </div>
    </section>

    <aside class="card">
      <div class="side">
        <h3 style="margin:0 0 8px">🎁 惊喜宝箱</h3>
        <div class="chest" id="rewardText">达到 10 分，宝箱会打开！</div>

        <h3 style="margin:0 0 8px">🏅 勋章墙</h3>
        <div class="badge-list">
          <span id="badge10" class="badge">10分新星</span>
          <span id="badge20" class="badge">20分能手</span>
          <span id="badge30" class="badge">30分小英雄</span>
          <span id="badgeStreak" class="badge">3连胜冷静王</span>
        </div>

        <h3 style="margin:4px 0 8px">📘 冒险日志</h3>
        <ul id="log" class="log"></ul>
      </div>
    </aside>
  </main>

  <script>
    const scenarios = [
      { title: '玩具星球', text: '玩完玩具后，地上乱糟糟。', good: '把玩具分类收回箱子。', bad: '直接跑去做别的。', hint: '自己的事情自己收，超酷！' },
      { title: '作业基地', text: '你很想先看动画片。', good: '先完成作业再放松。', bad: '一直拖到睡前。', hint: '先做重要的事，后面更轻松。' },
      { title: '排队港口', text: '买点心时队伍很长。', good: '安静排队并等待。', bad: '偷偷插队。', hint: '守规则会得到大家点赞。' },
      { title: '情绪火山', text: '比赛输了，心里很生气。', good: '深呼吸，说“再试一次”。', bad: '大喊大叫摔东西。', hint: '先冷静，才能变得更强。' },
      { title: '分享森林', text: '同学想借你的彩笔。', good: '约好时间后借给他。', bad: '不讲理由地拒绝。', hint: '会分享的人，朋友更多。' },
      { title: '安全大道', text: '快迟到了，要过马路。', good: '走斑马线看红绿灯。', bad: '直接冲过去。', hint: '安全第一，永远不过时。' }
    ];

    const rewardIdeas = [
      '解锁奖励：今晚挑一本你最爱的故事书 📚',
      '解锁奖励：和爸爸妈妈做 10 分钟小游戏 🧩',
      '解锁奖励：获得一张“今日进步贴纸” 🏅',
      '解锁奖励：周末可选一个手工小任务 ✂️',
      '解锁奖励：晚饭后全家散步 15 分钟 🚶'
    ];

    const rules = {
      easy: { good: 2, bad: 2, label: '简单' },
      normal: { good: 3, bad: 2, label: '普通' },
      hard: { good: 4, bad: 3, label: '挑战' }
    };

    const state = {
      score: 0,
      stars: 0,
      streak: 0,
      current: 0,
      answered: false,
      difficulty: 'normal'
    };

    const refs = {
      score: document.getElementById('score'),
      stars: document.getElementById('stars'),
      streak: document.getElementById('streak'),
      mood: document.getElementById('mood'),
      scenario: document.getElementById('scenario'),
      rewardText: document.getElementById('rewardText'),
      log: document.getElementById('log'),
      levelText: document.getElementById('levelText'),
      levelFill: document.getElementById('levelFill'),
      rank: document.getElementById('rank'),
      avatar: document.getElementById('avatar'),
      difficultySel: document.getElementById('difficultySel'),
      fxToast: document.getElementById('fxToast')
    };

    function saveState() {
      localStorage.setItem('kidRewardGameState', JSON.stringify(state));
      localStorage.setItem('kidRewardGameLog', refs.log.innerHTML);
    }

    function loadState() {
      const cached = localStorage.getItem('kidRewardGameState');
      const cachedLog = localStorage.getItem('kidRewardGameLog');
      if (!cached) return;
      try {
        Object.assign(state, JSON.parse(cached));
        if (cachedLog) refs.log.innerHTML = cachedLog;
      } catch {
        localStorage.removeItem('kidRewardGameState');
        localStorage.removeItem('kidRewardGameLog');
      }
    }

    function addLog(type, msg) {
      const li = document.createElement('li');
      li.innerHTML = `<span class="${type}">${type === 'good' ? '奖励' : '惩罚'}</span>：${msg}`;
      refs.log.prepend(li);
    }

    function showFx(message) {
      refs.fxToast.textContent = message;
      refs.fxToast.classList.add('show');
      setTimeout(() => refs.fxToast.classList.remove('show'), 900);
    }

    function moodByScore(score) {
      if (score >= 30) return '超开心';
      if (score >= 20) return '开心';
      if (score >= 10) return '平静';
      return '加油';
    }

    function updateRank() {
      if (state.score >= 30) {
        refs.rank.textContent = '星际小英雄';
        refs.avatar.textContent = '🦸';
      } else if (state.score >= 20) {
        refs.rank.textContent = '进阶小队员';
        refs.avatar.textContent = '😄';
      } else if (state.score >= 10) {
        refs.rank.textContent = '认真练习生';
        refs.avatar.textContent = '🙂';
      } else {
        refs.rank.textContent = '见习小队员';
        refs.avatar.textContent = '🧒';
      }
    }

    function updateMap() {
      const planets = ['planet1', 'planet2', 'planet3', 'planet4', 'planet5'];
      const cleared = Math.min(5, Math.floor(state.score / 6));
      planets.forEach((id, index) => {
        document.getElementById(id).classList.toggle('on', index < cleared);
      });
    }

    function updateBadges() {
      document.getElementById('badge10').classList.toggle('on', state.score >= 10);
      document.getElementById('badge20').classList.toggle('on', state.score >= 20);
      document.getElementById('badge30').classList.toggle('on', state.score >= 30);
      document.getElementById('badgeStreak').classList.toggle('on', state.streak >= 3);
    }

    function updateRewardText() {
      if (state.score < 10) {
        refs.rewardText.textContent = '达到 10 分，宝箱会打开！';
        return;
      }
      const index = state.score % rewardIdeas.length;
      refs.rewardText.textContent = rewardIdeas[index];
    }

    function updatePanel() {
      refs.score.textContent = state.score;
      refs.stars.textContent = state.stars;
      refs.streak.textContent = state.streak;
      refs.mood.textContent = moodByScore(state.score);
      refs.levelText.textContent = `${state.score} / 30`;
      refs.levelFill.style.width = `${Math.min(100, (state.score / 30) * 100)}%`;
      refs.difficultySel.value = state.difficulty;

      updateBadges();
      updateRewardText();
      updateRank();
      updateMap();
      saveState();
    }

    function renderScenario() {
      const item = scenarios[state.current];
      refs.scenario.innerHTML = `
        <strong>【第 ${state.current + 1} 关：${item.title}】</strong><br>
        ${item.text}<br><br>
        <span style="color:#166534">✅ 好选择：${item.good}</span><br>
        <span style="color:#991b1b">❌ 坏选择：${item.bad}</span>
      `;
      state.answered = false;
      saveState();
    }

    function applyChoice(type) {
      if (state.answered) return;
      state.answered = true;
      const scoreRule = rules[state.difficulty];

      if (type === 'good') {
        state.score += scoreRule.good;
        state.streak += 1;
        addLog('good', `太棒啦！+${scoreRule.good} 分（${scoreRule.label}）`);
        showFx(`+${scoreRule.good} 星星能量！`);
      } else {
        state.score = Math.max(0, state.score - scoreRule.bad);
        state.streak = 0;
        addLog('bad', `这次失误，-${scoreRule.bad} 分（${scoreRule.label}）`);
        showFx(`-${scoreRule.bad}，下次加油！`);
      }

      state.stars = Math.floor(state.score / 5);

      if (state.score >= 30) {
        addLog('good', '🎉 恭喜通关！获得“星际小英雄”称号！');
      }
      if (state.streak === 3) {
        addLog('good', '👏 连续 3 次好选择，解锁“冷静王”！');
      }

      updatePanel();
    }

    function nextScenario() {
      state.current = (state.current + 1) % scenarios.length;
      renderScenario();
      updatePanel();
    }

    function showHint() {
      const item = scenarios[state.current];
      addLog('good', `提示：${item.hint}`);
      showFx('提示已解锁 💡');
      saveState();
    }

    function resetGame() {
      state.score = 0;
      state.stars = 0;
      state.streak = 0;
      state.current = 0;
      state.answered = false;
      state.difficulty = 'normal';
      refs.log.innerHTML = '';
      addLog('good', '新的冒险开始啦！出发！');
      renderScenario();
      updatePanel();
    }

    document.getElementById('goodBtn').addEventListener('click', () => applyChoice('good'));
    document.getElementById('badBtn').addEventListener('click', () => applyChoice('bad'));
    document.getElementById('nextBtn').addEventListener('click', nextScenario);
    document.getElementById('hintBtn').addEventListener('click', showHint);
    document.getElementById('resetBtn').addEventListener('click', resetGame);
    refs.difficultySel.addEventListener('change', (e) => {
      state.difficulty = e.target.value;
      addLog('good', `难度切换为 ${rules[state.difficulty].label} 模式`);
      showFx(`${rules[state.difficulty].label}模式`);
      updatePanel();
    });

    loadState();
    if (!refs.log.innerHTML.trim()) addLog('good', '欢迎加入星星冒险队！');
    renderScenario();
    updatePanel();
  </script>
</body>
</html>
